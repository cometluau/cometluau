<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comet Luau — Lua script hosting</title><link rel="stylesheet" href="/css/comet.css"></head><body>
<main class="wrap">
<section class="hero"><h1>Host and share <span style="color:var(--accent)">Lua</span> scripts at light speed.</h1>
<p class="muted" style="max-width:560px">Publish Lua source, get a raw link that works with loadstring, and manage it with a private key. No account needed.</p>
<div class="row"><a class="btn" href="/pastebin">Create Paste</a></div></section>
<section class="card"><h2 style="margin-top:0">Loadstring</h2>
<div class="loadstring"><code id="ls">loadstring(game:HttpGet("https://cometluau.pages.dev/raw/PASTE_ID"))()</code><button class="btn" id="cp">Copy</button></div></section>
<h2>Platform statistics</h2><div class="grid" id="stats" aria-live="polite"><div class="card muted">Loading…</div></div>
</main>
<script type="module">
import { shell, api, copy, $ } from '/js/app.js';
shell();
$('#cp').onclick = (e) => copy($('#ls').textContent, e.target);
try { const s = await api('/api/stats'); $('#stats').innerHTML = [['Total pastes', s.total], ['Active', s.active], ['Expired', s.expired]].map(([k, v]) => `<div class="card stat"><b>${v}</b><span class="muted">${k}</span></div>`).join(''); }
catch { $('#stats').innerHTML = '<div class="card muted">Statistics are unavailable right now.</div>'; }
</script></body></html>
