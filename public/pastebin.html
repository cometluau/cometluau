<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comet | Pastebin</title><meta name="theme-color" content="#030917">
<link rel="icon" type="image/png" href="/img/favicon.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:title" content="Comet"><meta property="og:description" content="Lua script hosting and pastebin."><meta property="og:image" content="https://cometluau.pages.dev/img/logo-large.jpg"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/css/comet.css"></head><body>

<script src="/assets/disable-devtool.min.js"></script>

<script>
    DisableDevtool({
        disableMenu: true,
        disableSelect: true,
        disableInputSelect: false,
        disableCopy: false,
        disableCut: false,
        disablePaste: false,
        clearLog: true
    });
</script>
  
<main class="wrap"><h1 class="gt">New paste</h1>
<form id="f" class="card" novalidate>
<label for="title">Title</label><input id="title" maxlength="100" required>
<label for="desc">Description (optional)</label><input id="desc" maxlength="500">
<label>Lua source</label><div id="src"></div>
<label for="exp">Expiration</label><select id="exp"><option value="1hr">1hr</option><option value="1d">1d</option><option value="1w">1w</option><option value="1m">1m</option><option value="1yr">1yr</option><option value="forever" selected>forever</option></select>
<p><button class="btn" id="go">Create Paste</button></p></form>
<section id="done" class="card" hidden><h2>Paste created</h2>
<p><a id="link"></a></p><label>Loadstring</label><div class="loadstring"><code id="ls"></code><button class="btn" id="c1" type="button">Copy</button></div>
<div class="warn">Save this private management key. You will need it to edit or delete your paste, and to view its source later.</div>
<div class="loadstring"><code id="key"></code><button class="btn" id="c2" type="button">Copy</button></div></section></main>
<script type="module">
import { shell, api, copy, toast, highlight, editor, $ } from '/js/app.js';
shell();
const ed = editor($('#src'));
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!$('#title').value.trim() || !ed.get().trim()) return toast('Title and Lua source are required.', true);
  $('#go').disabled = true;
  try {
    const r = await api('/api/pastes', { method: 'POST', body: JSON.stringify({ title: $('#title').value, description: $('#desc').value, source: ed.get(), expiry: $('#exp').value }) });
    const origin = location.origin;
    const ls = `loadstring(game:HttpGet("${origin}/raw/${r.id}"))()`;
    $('#link').href = r.url; $('#link').textContent = origin + r.url;
    $('#ls').innerHTML = highlight(ls); $('#key').textContent = r.key;
    $('#c1').onclick = (ev) => copy(ls, ev.target); $('#c2').onclick = (ev) => copy(r.key, ev.target);
    $('#f').remove(); $('#done').hidden = false; toast('Paste created');
  } catch (err) { toast(err.message, true); $('#go').disabled = false; }
});
</script></body></html>
